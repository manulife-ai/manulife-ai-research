# Open Source Projects

- name: models-eval-playbook
  repo_url: https://github.com/manulife-ai/models-eval-playbook
  status: active
  team_owner: Applied AI Research
  license: ""
  last_release: "2026-02"
  description: >
    CLI-based playbook for evaluating LLMs with MLflow logging.
    Supports multiple providers including Azure OpenAI, Ollama, OpenRouter,
    and Alibaba Cloud. Enables testing a model under evaluation against
    a configurable judge model.

- name: financialqa
  repo_url: https://github.com/manulife-ai/financialqa
  status: active
  team_owner: University of Waterloo Partnership
  license: ""
  last_release: "2026-01"
  description: >
    Multi-structured financial document question answering using RAG.
    Extracts text, tables, and figures from financial report PDFs via
    Azure Document Intelligence, with LangChain-based chunking and
    Azure OpenAI embeddings. Associated with the ECIR 2026 paper
    "Understanding Multi-Structured Documents via LLMs."
